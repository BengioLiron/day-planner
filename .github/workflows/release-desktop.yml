# Builds the Windows installer and publishes it as a GitHub Release.
# Start it either way:
#   - On GitHub: Actions → Release desktop app → Run workflow, and enter a version (e.g. 1.0.1)
#   - From a terminal: git tag v1.0.1 && git push origin v1.0.1
# The installed app checks these releases and updates itself.
name: Release desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.1. It must be higher than the last release."
        required: true

permissions:
  contents: write # create the release and upload the installer

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # uses the pnpm version in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Set the app version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # From the Run workflow box, or from the tag name (v1.0.1 → 1.0.1).
          VERSION="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.0.1 (got '$VERSION')"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cd apps/desktop && npm pkg set version="$VERSION"
          echo "Building Day Planner $VERSION"

      # The release starts as a draft, so the app never sees it half-uploaded.
      - name: Create a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v$VERSION"
          DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$DRAFT" = "false" ]; then
            echo "::error::Release $TAG is already published. Run the workflow again with a higher version."
            exit 1
          fi
          if [ "$DRAFT" = "true" ]; then
            echo "Reusing the draft left by an earlier run of $TAG."
            exit 0
          fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" \
            --title "Day Planner $VERSION" \
            --notes "Download Day-Planner-Setup-$VERSION.exe below and run it. Installed copies update to this version automatically."

      - name: Build the installer and upload it to the draft
        run: pnpm --filter day-planner release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishing creates the version tag on the commit that was built.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "v$VERSION" --json assets --jq '.assets[].name' | tee assets.txt
          grep -qx "latest.yml" assets.txt || { echo "::error::latest.yml is missing, so installed apps couldn't update."; exit 1; }
          gh release edit "v$VERSION" --draft=false --latest
