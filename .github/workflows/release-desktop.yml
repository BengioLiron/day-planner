# Builds the Windows installer and publishes it as a GitHub Release.
# Runs when you push a version tag, e.g.:  git tag v1.1.0 && git push origin v1.1.0
# The installed app checks these releases and updates itself.
name: Release desktop app

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload the installer

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # uses the pnpm version in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Use the tag as the app version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd apps/desktop && npm pkg set version="$VERSION"
          echo "Building Day Planner $VERSION"

      - name: Build installer and publish release
        run: pnpm --filter day-planner release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
